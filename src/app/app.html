<app-controls (orderByIdClick)="orderById() "  
(orderByNameClick)="orderByName()" 
(invertListClick)="invertList()">
</app-controls>


<div class="container">
  @for (user of users(); track user.id) {
    <app-user-card 
    [user]="user"
    (deleteUser)="deleteUser($event)"></app-user-card>
  } @empty {
    <p>No hay usuarios para mostrar</p>
  }
</div>


<h1>Directorio (<span>{{ usersCount() }}</span>)</h1>
